services:
  db:
    image: postgres:17
    container_name: reqminer-db
    environment:
      POSTGRES_USER: reqminer
      POSTGRES_PASSWORD: reqminer
      POSTGRES_DB: reqminer
    ports:
      - "5432:5432"
    volumes:
      - reqminer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqminer -d reqminer"]
      interval: 5s
      timeout: 3s
      retries: 10

  graph:
    image: neo4j:5-community
    container_name: reqminer-graph
    environment:
      NEO4J_AUTH: neo4j/reqminer
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"  # браузер Neo4j (http://localhost:7474)
      - "7687:7687"  # Bolt
    volumes:
      - reqminer_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  reqminer_pgdata:
  reqminer_neo4jdata:
