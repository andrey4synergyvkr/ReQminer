# Каталог документов каркаса технической документации.
#
# Каждый документ присутствует в каркасе всегда: раздел без фактов получает заглушку с причиной empty_reason.
# Структура и разметка живут в Jinja-шаблонах documents/, промпты генерации разделов — в prompts/.

[[documents]]
id = "vision"
path = "vision_and_strategy.md"
title = "Видение и стратегия"
group = "Видение и стратегия"
type = "vision"
template = "documents/vision_and_strategy.md.j2"
empty_reason = "раздел пуст: факты типа Vision не извлечены"

[[documents]]
id = "glossary"
path = "glossary.md"
title = "Глоссарий"
group = "Глоссарий"
type = "term"
template = "documents/glossary.md.j2"
empty_reason = "раздел пуст: термины не извлечены"

